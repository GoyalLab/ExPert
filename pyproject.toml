[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expert-model"
dynamic = ["version"]
description = "ExPert: a contrastive perturbation-prediction model for single-cell data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leon Schwartz" }]
keywords = ["perturb-seq", "single-cell", "perturbation", "scRNA-seq", "genomics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Core: train, load, predict(), get_prototypes(). Lower bounds = the versions the release was validated with
# (environment.yaml); matplotlib / seaborn are imported by the model module itself.
dependencies = [
  "anndata>=0.11",
  "h5py>=3.12",
  "lightning>=2.4",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "rich>=13.9",
  "scanpy>=1.10",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "scvi-tools>=1.4.2",
  "seaborn>=0.13",
  "torch>=2.5",
  "torchmetrics>=1.5",
  "tqdm>=4.67",
]

[project.optional-dependencies]
# Everything else: the training-time UMAP / enrichment plots, the paper's figure scripts (paper/), and the tests.
all = [
  "adjustText",
  "gseapy",
  "leidenalg",
  "matplotlib-venn",
  "natsort",
  "nbformat",
  "networkx",
  "openpyxl",
  "pillow",
  "pydeseq2",
  "pytest",
  "python-igraph",
  "requests",
  "tensorboard",
  "umap-learn",
]

[project.urls]
Homepage = "https://github.com/GoyalLab/ExPert"
Models = "https://huggingface.co/GoyalLab/ExPert"

[tool.setuptools.dynamic]
version = { attr = "expert.__version__" }

[tool.setuptools.packages.find]
include = ["expert*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --color=yes"
# `pytest -m "not e2e"` runs only the seconds-long unit tests; the e2e ones train the toy v0.1.0 model on CPU.
markers = [
    "e2e: trains the toy v0.1.0 configuration on CPU (minutes)",
]

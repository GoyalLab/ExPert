records:
  - key: figure_data
    related:   # the plot caches are computed from the other three records
      - {record: source_data, relation: isDerivedFrom}
      - {record: derived, relation: isDerivedFrom}
      - {record: gene_embeddings, relation: isDerivedFrom}
    metadata:
      title: "ExPert - figure data"
      description: >-
        Plot caches read by the figure notebooks of the ExPert paper: one zip per main and supplementary figure,
        unpacking to figures/&lt;fig&gt;/{data,inputs}/. CONTENTS.tsv lists every file.
    items:
      - kind: figures
        tsv: paper/reproducibility/plot_time_inputs.tsv

  - key: source_data
    metadata:
      title: "ExPert - source data"
      description: >-
        Data generated for the ExPert paper (count matrices and processed tables; sequencing reads are deposited in GEO):
        the degron (AID) screen; alcohol-associated liver disease bulk RNA-seq (DESeq2, rMATS, normalized counts),
        imaging and RT-PCR (gel images and quantification); primary mitochondrial disease PBMC and in vitro scRNA-seq,
        sorted-cell bulk RNA-seq (salmon counts) and flow cytometry; sci-Plex3 drug and target annotations, and curated gene lists.
    items:
      - {kind: file, path: $EXPERT_ROOT/data/inference/degron/data/degron_labeled.h5ad}
      - kind: zip
        name: ald_imaging_rtpcr.zip
        members:
          - {path: $EXPERT_ROOT/paper/figures/fig5/data/experiment_raw/Microscopy, arc: Microscopy}
          - {path: $EXPERT_ROOT/paper/figures/fig5/data/experiment_raw/Gel, arc: RT-PCR}   # gel images + Qty.prism quantification
      - kind: zip
        name: ald_bulk_rnaseq.zip
        # DESeq2 / rMATS results and normalized counts (fastqs go to GEO)
        members:
          - {path: $EXPERT_ROOT/paper/figures/fig5/data/experiment_raw/BulkRNASeqAnalysis, arc: ald_bulk_rnaseq, exclude: ['plots/*']}
      - {kind: file, path: $EXPERT_ROOT/data/inference/metabolic_weinberg/converted_data/s_pbmc_collab.h5ad, name: pmd_pbmc_scrna.h5ad}
      - {kind: file, path: $EXPERT_ROOT/data/inference/metabolic_weinberg/converted_data/s_invitro_collab.h5ad, name: pmd_invitro_scrna.h5ad}
      - kind: zip
        name: pmd_sorted_bulk_rnaseq.zip
        # salmon gene counts + lengths + SummarizedExperiment + sample metadata (fastqs go to GEO)
        members:
          - {path: $EXPERT_ROOT/paper/figures/fig6/data/mito_bulk/salmon, arc: pmd_sorted_bulk_rnaseq}
      - {kind: file, path: $EXPERT_ROOT/paper/figures/fig6/data/flow/mito_flow_combined_raw.xlsx, name: pmd_flow_cytometry.xlsx}
      - kind: zip
        name: sciplex3_annotations.zip
        # curated family genes + HDAC complexes, and what fig4.sbatch STEP=sciplex_annot builds from them (candidate
        # panel, drug -> family, CORUM-core partners, ChEMBL targets + the raw API responses for an exact offline rerun)
        members:
          - {path: $EXPERT_ROOT/paper/figures/fig4/data/sciplex_annot_curated, arc: curated}
          - {path: $EXPERT_ROOT/paper/figures/fig4/data/v0.1.0/sciplex_annot, arc: sciplex_annot}
      - {kind: file, path: $EXPERT_ROOT/paper/figures/fig4/data/sciplex3_drug_targets.tsv}
      - {kind: file, path: $EXPERT_ROOT/paper/figures/fig6/data/PMD_gene_list.csv}
      - {kind: file, path: $EXPERT_ROOT/paper/figures/fig4/data/leigh_pmd_repro_2026-10-15/leigh_v010/config/modules.tsv, name: leigh_modules.tsv}

  - key: gene_embeddings
    metadata:
      title: "ExPert - gene embeddings"
      description: >-
        Gene embeddings used by ExPert: LLM-written gene descriptions embedded with 11-13 text encoders per writer,
        gene priors built from DepMap, STRING, LINCS L1000, JUMP Cell Painting, ProteinTalks, GENCODE positions,
        co-expression and response, their shuffled controls, the random-init control, and the description texts
        with the retrieved source records (gene_source_database.json). Each bank is an .npz with arrays
        'embeddings' (genes x dims) and 'genes'.
    items:
      - kind: zip
        name: text_opus-4.8.zip
        members: [{path: resources/embeddings/opus-4.8}]
      - kind: zip
        name: text_opus-4.7.zip
        members: [{path: resources/embeddings/opus-4.7}]
      - kind: zip
        name: text_sonnet-4.5.zip
        members: [{path: resources/embeddings/sonnet-4.5}]
      - kind: zip
        name: priors.zip
        members: [{path: resources/embeddings/priors}]
      - kind: zip
        name: random_init.zip
        members: [{path: resources/embeddings/random_init}]
      - kind: zip
        name: descriptions.zip
        members: [{path: resources/gene_embeddings/claude_sonnet_4.5/descriptions, arc: descriptions}]
      - {kind: file, path: resources/embeddings/eval.csv}
      - {kind: file, path: resources/embeddings/eval.svg}

  - key: derived
    metadata:
      title: "ExPert - derived data"
      description: >-
        Intermediates of the ExPert paper that are costly to regenerate: the Tahoe-100M pseudobulk
        (plate x cell line x drug x dose), ExPert encodings of the double-perturbation screens (ProPer-seq as
        latents and ranks only), RNA-fingerprinting outputs, benchmark score tables, analysis tables, the CRISPR
        signature reference and control pools.
    items:
      - {kind: file, path: $EXPERT_ROOT/data/inference/tahoe100m/pseudobulk/tahoe100m_pseudobulk_plate_line_drug_dose.h5ad}
      - {kind: file, path: $EXPERT_ROOT/data/inference/sciplex/results/fig5_v0.1.0/crispr_signature_ref.npz}
      - {kind: file, path: $EXPERT_ROOT/paper/figures/fig5/data/hubness/v0.1.0_ctrl_pools_ds.npz}
      - kind: zip
        name: doubles_encodings_v0.1.0.zip
        members:
          - path: $EXPERT_ROOT/paper/figures/fig4/data/pb/ExPert_v0.1.0
            arc: doubles_encodings_v0.1.0
            exclude: ['properseq/logpb.npy', 'properseq/noise.npy', 'properseq/_m25_backup/*', 'properseq/_m5ratio96/*']
      - kind: zip
        name: fingerprint_sciplex_perline.zip
        members: [{path: $EXPERT_ROOT/paper/figures/fig4/data/v0.1.0/fingerprint_sciplex_perline}]
      - kind: zip
        name: fingerprint_doubles_singles_flexplex.zip
        members:
          - {path: $EXPERT_ROOT/paper/figures/fig4/data/fingerprint_doubles}
          - {path: $EXPERT_ROOT/paper/figures/fig4/data/fingerprint_doubles_gwps}
          - {path: $EXPERT_ROOT/paper/figures/fig4/data/fingerprint_doubles_ourgwps}
          - {path: $EXPERT_ROOT/paper/figures/fig4/data/fingerprint_singles_ourgwps}
          - {path: $EXPERT_ROOT/data/inference/flexplex/fingerprint_flexplex}
      - kind: zip
        name: benchmark_tables.zip
        members:
          - {path: $EXPERT_PROJECT/ExPert-benchmarks/metrics/ctx7, arc: ctx7, include: ['*.csv', '*.parquet', 'selective', 'pbulk_groups'], exclude: ['*.bak*']}
          - {path: $EXPERT_ROOT/benchmarks/metrics_small_rescored, arc: small, include: ['*.csv', '*.parquet']}
          - {path: $EXPERT_PROJECT/ExPert-benchmarks/metrics/small/extra_metrics.v2.csv, arc: small/extra_metrics.v2.csv}
          - {path: $EXPERT_PROJECT/ExPert-benchmarks/metrics/slurm_costs.rebuilt.csv}
          - {path: $EXPERT_PROJECT/ExPert-benchmarks/config/cost_overrides.yaml}
          - {path: $EXPERT_ROOT/benchmarks, arc: mask_ablation, include: ['abl_mask_target_fold_*/metrics/mask_ablation.csv']}
      - kind: zip
        name: analysis_tables.zip
        members:
          - {path: analysis_out/prior_screen, arc: prior_screen}
          - {path: analysis_out/effgate_decomp, arc: effgate_decomp}
          - {path: analysis_out/v017_readout/ranks, arc: v017_readout/ranks}
          - {path: analysis_out/effect_conf/stack_val_cells.parquet, arc: effect_conf/stack_val_cells.parquet}
          - {path: analysis_out/fill_fix, arc: fill_fix, include: ['wk12_summary.csv', 'w12_summary.csv', 'w_fold4/k.json', 'wk_fold4/k.json']}
          - {path: analysis_out/mapcache, arc: mapcache, include: ['scores_nqxnds_*.tsv']}

  - key: software
    opt_in: true   # final publication only, not the preprint: needs --opt-in (OPT_IN=1)
    metadata:
      title: "ExPert - code"
      upload_type: software
      license: mit
      description: >-
        Snapshot of the ExPert code repository used for the paper (model, training, analysis and figure scripts).
        Gene-embedding banks are in the "ExPert paper - gene embeddings" record; models are on Hugging Face.
    items:
      - kind: git
        repo: .
        ref: paper-v0.1.0   # replace with the paper tag before the real upload
        name: ExPert-paper-code.tar.gz
        prefix: ExPert-paper-code
        exclude: [resources/embeddings, resources/gene_embeddings, notebooks/.archive]
